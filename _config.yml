# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: "Robert Law, PhD"
email: nosimpler@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  Computational neuroscientist and mathematical biologist in Central Massachusetts.
github_username: nosimpler
minimal_mistakes_skin: default
search: true

# Build settings
repository: nosimpler/nosimpler.github.io
markdown: kramdown
kramdown:
  parse_block_html: true   # so Markdown inside Quarto figure <div>s renders
remote_theme: mmistakes/minimal-mistakes
# Outputting
permalink: /:categories/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
timezone: America/New_York

include:
  - _pages

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
exclude:
  - PLAN.md
  - SITE_NOTES.md
  - POSTING.md
  - scripts/
  - .devcontainer/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - README.md
  - LICENSE
  - assets/images/logo.png   # CC BY-SA derivative; unpublished until attribution is sorted
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name   : "Robert Law, PhD"
  # avatar : "/assets/images/logo.png"  # derived from a CC BY-SA Wikimedia image; needs attribution before restoring
  bio    : "Models, methods, and mathematics for biological structure and dynamics"
  location: "Central Massachusetts"
  links:
    - label: "Contact"
      icon: "fas fa-fw fa-envelope"
      url: "/contact/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/nosimpler"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/robert-law-a213644"
    - label: "ORCID"
      icon: "fab fa-fw fa-orcid"
      url: "https://orcid.org/0000-0002-1220-3871"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/nosimpler"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# Analytics: GoatCounter (privacy-friendly, no cookies). Set goatcounter_code to
# the account code from https://www.goatcounter.com (the "xxx" in xxx.goatcounter.com).
# Left empty, no tracking script is loaded.
analytics:
  provider: custom
goatcounter_code: ""
